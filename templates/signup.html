{% extends "base.html" %}
{% block title %}Sign Up — City Portal{% endblock %}
{% block content %}
<div class="auth-page">
  <div class="auth-bg-circles"><span></span><span></span><span></span></div>

  <div class="auth-card">
    <div class="auth-top-bar">
      <div class="lang-selector">
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="hi">हि</button>
        <button class="lang-btn" data-lang="mr">म</button>
      </div>
      <button class="theme-btn" id="themeToggleBtn">
        <span class="theme-icon" id="themeIcon">☀️</span>
        <span id="themeLabel" data-t="theme_light">Light</span>
      </button>
    </div>

    <div class="auth-logo">
      <div class="logo-icon">🏙️</div>
      <h1 data-t="signup_title">Create Account</h1>
      <p data-t="signup_subtitle">Join City Portal today</p>
    </div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="{{ url_for('signup') }}">
      <div class="form-group">
        <label class="form-label" data-t="signup_name">Full Name</label>
        <input type="text" name="name" class="form-control" data-t-ph="signup_name" placeholder="Full Name" required/>
      </div>
      <div class="form-group">
        <label class="form-label" data-t="signup_email">Email Address</label>
        <input type="email" name="email" class="form-control" data-t-ph="signup_email" placeholder="Email Address" required/>
      </div>
      <div class="form-group">
        <label class="form-label" data-t="signup_phone">Phone Number</label>
        <input type="tel" name="phone" class="form-control" data-t-ph="signup_phone" placeholder="Phone Number"/>
      </div>
      <div class="form-group">
        <label class="form-label" data-t="signup_password">Password</label>
        <input type="password" name="password" class="form-control" data-t-ph="signup_password" placeholder="Password" required minlength="6"/>
      </div>
      <button type="submit" class="btn btn-primary btn-full" data-t="signup_btn">Create Account</button>
    </form>

    <div class="auth-footer">
      <span data-t="signup_have_account">Already have an account?</span>
      <a href="{{ url_for('login') }}" data-t="signup_login_link"> Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
